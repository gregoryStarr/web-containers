name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npx nx build browser-ci-pipeline --prod

      - name: Deploy to Preview (on PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "🚀 Deploying preview for PR #${{ github.event.pull_request.number }}..."
          # Insert preview deployment command here (e.g., wrangler pages deploy or vercel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Production (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🌟 Deploying to production..."
          # Insert production deployment command here
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
